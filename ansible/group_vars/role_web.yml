# The web server lives in a private subnet with no public IP, so Ansible cannot
# reach it directly. Every connection is tunnelled through the bastion using an
# SSH ProxyCommand.
#
# The bastion's address is looked up from the same dynamic inventory run, so no
# IP is hardcoded here either — exactly like the single-server setup, just with
# an extra hop.

bastion_ip: "{{ hostvars[groups['role_bastion'][0]]['ansible_host'] }}"

ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=accept-new
  -o ProxyCommand="ssh -W %h:%p -q
  -i {{ ansible_ssh_private_key_file }}
  -o StrictHostKeyChecking=accept-new
  {{ ansible_user }}@{{ bastion_ip }}"
